# GigaCheck Detector (Segmentation-based AI text detection)
# Detects AI-written character intervals within mixed human/AI text
# Paper: https://arxiv.org/abs/2410.23728
# See docs/CONFIGURATION.md for detailed parameter descriptions

model: gigacheck

# Model Configuration
model_path: iitolstykh/GigaCheck-Detector-Multi  # HuggingFace model path

# Device Settings
device: auto  # Options: "auto", "cuda", "cuda:0", "cpu"

# Detection Parameters
# `conf_interval_thresh` = 0.0 matches the paper / upstream's benchmark protocol
# (`baseline/gigacheck/gigacheck/train/scripts/train_detr_model.py` evaluates mAP
# with no confidence filter — the full ranked set is needed for precision-recall
# sweeps). Raising this filters low-confidence predictions post-hoc — useful for
# display, harmful for leaderboard-style mAP. Keep 0.0 for paper-faithful behaviour.
conf_interval_thresh: 0.0

# Coverage-based pred_label thresholds (used only when the classification head is
# UNTRAINED — i.e. `iitolstykh/GigaCheck-Detector-Multi`). The wrapper merges
# overlapping intervals first, then:
#   coverage >= ai_coverage_max → "ai"     (binary label = 1)
#   coverage >  ai_coverage_min → "mixed"  (binary label = 1)
#   else                        → "human"  (binary label = 0)
# Defaults preserve the previous heuristic. Tune for HAT-Bench-style mixed text.
ai_coverage_min: 0.1
ai_coverage_max: 0.9
# When deriving the coverage-based label, only consider DETR queries whose
# softmax foreground prob ≥ this. Raw `ai_intervals` (all queries that pass
# `conf_interval_thresh`) remain in metadata untouched. 0.5 = "the model itself
# preferred AI for this span"; lower values are more permissive (good for spans
# the model is uncertain about).
coverage_conf_thresh: 0.5

# Model Details:
# - Architecture: Mistral-7B backbone + DETR for interval detection
# - Training: Multi-domain training on LLMTrace dataset
# - Output: Character-level AI intervals + document classification
# - License: Apache 2.0

# Performance Notes:
# - Speed: Slower inference due to Mistral-7B backbone (~2-5s per text on GPU)
# - GPU: ~14GB VRAM (Mistral-7B)
# - CPU: Not recommended (too slow)
# - Supports mixed human/AI text detection

# How it works:
# 1. Tokenize input text
# 2. Run through Mistral-7B backbone
# 3. Classification head predicts: human/ai/mixed
# 4. DETR head predicts AI-written character intervals
# 5. Returns document label + AI intervals

# Output format:
# {
#   "label": 0/1,  # 0=human, 1=AI (any AI content)
#   "score": float,  # AI probability
#   "metadata": {
#     "pred_label": "human"/"ai"/"mixed",
#     "ai_intervals": [[start, end], ...],  # Character positions
#   }
# }

# Usage:
# from omini_text import pipeline
# pipe = pipeline("ai-text-detection", model="gigacheck")
# result = pipe("Your text here")
