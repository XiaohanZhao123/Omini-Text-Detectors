# Short-PHD Detector (Short text detection via topological data analysis)
# Uses PHD with 12 off-topic prompt augmentations
# Reference: https://github.com/djwei96/ShortPHD
# See docs/CONFIGURATION.md for detailed parameter descriptions

model: short-phd

# Model Configuration
base_lm_name: meta-llama/Meta-Llama-3-8B-Instruct
cache_dir: ./cache

# Device Configuration
device: "0"  # CUDA device ID

# Detection Configuration
max_length: 1000  # Max tokenization length
# truncation_length: 150  # Uncomment to truncate input to N tokens (null = no truncation)
threshold: 15.0  # PHD score threshold: >= threshold -> AI, < threshold -> human

# Reproducibility
seed: 42

# Performance Notes:
# - GPU: Required, ~16GB VRAM for Llama-3-8B
# - Speed: ~5-15s per text (13 forward passes + PHD computation)
# - Designed for short text (sentences to short paragraphs)
# - Higher PHD score = more likely AI-generated

# How it works:
# 1. Prepend each of 12 detection prompts to the input text
# 2. Extract token embeddings from Llama-3-8B for each variant
# 3. Compute Persistent Homology Dimensionality on embedding point cloud
# 4. Final score = mean PHD across all 12 prompt augmentations

# Usage:
# from omini_text import pipeline
# pipe = pipeline("ai-text-detection", model="short-phd")
# result = pipe("Your text here")
