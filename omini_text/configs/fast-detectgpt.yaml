# Fast-DetectGPT Detector (95%+ AUROC, 340× faster than DetectGPT)
# Zero-shot detection using conditional probability curvature
# GPU REQUIRED - Cannot run on CPU
# See docs/CONFIGURATION.md for detailed parameter descriptions

model: fast-detectgpt

# Model Configuration (two models: sampling + scoring)
# Default = paper headline cell: Table 1 white-box, Neo-2.7 / XSum = 0.9876 AUROC
# (Bao et al., Fast-DetectGPT, ICLR 2024, arxiv 2310.05130).
# When sampling==scoring, only one model is loaded (~5 GB fp16, fits any single GPU).
sampling_model_name: gpt-neo-2.7B
scoring_model_name: gpt-neo-2.7B

# Pre-calibrated pairs (mu0/sigma0/mu1/sigma1 baked in
# baseline/fast-detect-gpt/scripts/local_infer.py:79):
# - gpt-neo-2.7B + gpt-neo-2.7B: paper headline AUROC 0.9876 (Table 1). DEFAULT, ~5 GB fp16.
# - gpt-j-6B    + gpt-neo-2.7B: paper alt, ~12 GB total fp16.
# - falcon-7b   + falcon-7b-instruct: post-publication accuracy optimisation
#   (~28 GB total — needs A100/H100 or 2× 24 GB GPUs).

# Device Configuration
device: "0" # Single GPU sufficient for default Neo-2.7B pair. Options: "0" (single), "0,1,2,3" (multi), "auto"

# Cache Configuration
cache_dir: "cache" # HuggingFace model cache directory (relative or absolute)

# Detection Configuration
threshold: 0.5 # Classification threshold (calibrated probability, 0.5 = balanced)

# Performance Notes:
# - Speed: 1-7s per text (model-dependent)
# - GPU: Required, multi-GPU recommended for large models
# - Min text length: 100 tokens (500+ tokens for best reliability)

# Available Models:
# gpt-neo-2.7B, gpt-j-6B, gpt-neox-20b, falcon-7b, falcon-7b-instruct,
# opt-2.7b, opt-13b, llama-13b, llama2-13b, bloom-7b1
# See docs/CONFIGURATION.md for full list and compatibility

