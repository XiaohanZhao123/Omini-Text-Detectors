[project]
name = "omini-text"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "intervaltree",
    "loguru",
    "dacite",
    "pyyaml",
    "numpy",
    "torch>=2.0",
    "transformers>=4.30",
    "huggingface_hub",
    "scipy",
    "fastNLP",
    "torchvision>=0.25.0",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
seqxgpt = [
    "torch>=2.0",
    "transformers>=4.30",
    "huggingface_hub",
    "scipy",
    "fastNLP",
]
damasha = [
    "pytorch-crf",
    "textstat",
    "nltk",
]
