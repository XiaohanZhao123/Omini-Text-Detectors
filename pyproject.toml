[project]
name = "omini-text"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "intervaltree",
    "loguru",
    "dacite",
    "pyyaml",
    "numpy",
    "torch>=2.0",
    "transformers==4.50.1",
    "huggingface_hub",
    "scipy",
    "fastNLP",
    "torchvision>=0.25.0",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
    "pandas",
    # LoRA / fine-tuning stack
    "peft>=0.14",
    "accelerate",
    "deepspeed",
    "torchmetrics",
    "clearml",
    "python-dotenv",
    "bitsandbytes",
    # DAMASHA + gigacheck extras
    "pytorch-crf",
    "textstat",
    "nltk",
    "omegaconf",
    "protobuf",
    "sentencepiece",
    "tensorboard",
    "openai",     # required by baseline/seqxgpt/.../backend_utils.py (module-level import)
    "msgpack",    # required by baseline/seqxgpt/.../backend_utils.py
    "setuptools<80",
    "datasets",   # OpAI-Bench loader pulls from HuggingFace Hub
    "hydra-core", # NeurIPS release entry point uses Hydra config
]

[project.optional-dependencies]
seqxgpt = [
    "torch>=2.0",
    "transformers==4.50.1",
    "huggingface_hub",
    "scipy",
    "fastNLP",
]
damasha = [
    "pytorch-crf",
    "textstat",
    "nltk",
]
